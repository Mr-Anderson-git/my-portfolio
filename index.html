<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление товарами</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .product-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .product-card img { max-width: 100px; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; background: #f9f9f9; padding: 20px; border-radius: 5px;}
        input, button { padding: 10px; }
    </style>
</head>
<body>

    <h2>Добавить / Обновить товар</h2>
    <form id="product-form">
        <input type="hidden" id="product-id">
        <input type="text" id="title" placeholder="Название (Title)" required>
        <input type="number" step="0.01" id="price" placeholder="Цена (Price)" required>
        <input type="text" id="description" placeholder="Описание (Description)" required>
        <input type="text" id="category" placeholder="Категория (Category)" required>
        <input type="url" id="image" placeholder="URL картинки (Image)" required>
        <button type="submit">Сохранить товар</button>
    </form>

    <h2>Список товаров</h2>
    <div id="product-list">
        </div>

    <script src="app.js"></script>
</body>
</html>
