<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление товарами</title>
    <style>
        body {
            background-color: #e6e6e6;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border: 2px solid #000;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        form {
            border: 1px solid #999;
            padding: 15px;
            background-color: #f4f4f4;
        }
        input {
            display: block;
            margin-bottom: 10px;
            width: 95%;
            padding: 5px;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-save {
            background-color: green;
            color: white;
            border: 2px solid darkgreen;
        }
        .btn-load {
            background-color: blue;
            color: white;
            border: 2px solid darkblue;
            margin-bottom: 20px;
            width: 100%;
        }
        .product-card {
            border: 2px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fff;
        }
        .product-card img {
            width: 120px;
            display: block;
            margin: 10px 0;
            border: 1px solid #ccc;
        }
        .btn-delete {
            background-color: red;
            color: white;
            border: 2px solid darkred;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Добавить товар</h2>
        <form id="product-form">
            <input type="text" id="title" placeholder="Название товара" required>
            <input type="number" step="0.01" id="price" placeholder="Цена" required>
            <input type="text" id="description" placeholder="Описание" required>
            <input type="text" id="category" placeholder="Категория" required>
            <input type="url" id="image" placeholder="Ссылка на картинку" required>
            <button type="submit" class="btn-save">Сохранить товар</button>
        </form>

        <h2>Список товаров</h2>
        <button id="get-products-btn" class="btn-load">Загрузить все товары</button>
        
        <div id="product-list"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
